<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YouTube Transcript Extractor</title>
    <meta
      name="description"
      content="Extract and download transcripts from YouTube videos with timestamps"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
    <style>
      /* Glassmorphism effects */
      .glass {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .glass-dark {
        background: rgba(0, 0, 0, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      /* Background gradient */
      body {
        background: linear-gradient(
          135deg,
          #000000 0%,
          #1a1a1a 50%,
          #000000 100%
        );
        min-height: 100vh;
      }
      /* Transcript chunk styling */
      .transcript-chunk {
        transition: all 0.2s ease;
      }
      .transcript-chunk:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      /* Scrollable container for long transcripts */
      .transcript-scroll {
        max-height: 600px;
        overflow-y: auto;
        scrollbar-width: thin;
        scrollbar-color: rgba(255, 255, 255, 0.3) transparent;
      }
      /* Webkit scrollbar styling */
      .transcript-scroll::-webkit-scrollbar {
        width: 6px;
      }
      .transcript-scroll::-webkit-scrollbar-track {
        background: transparent;
      }
      .transcript-scroll::-webkit-scrollbar-thumb {
        background-color: rgba(255, 255, 255, 0.3);
        border-radius: 3px;
      }
      .transcript-scroll::-webkit-scrollbar-thumb:hover {
        background-color: rgba(255, 255, 255, 0.5);
      }
      /* Minimum height for chunks */
      .chunk-container {
        min-height: 80px;
      }
      /* Mobile-specific improvements */
      @media (max-width: 640px) {
        .transcript-scroll {
          max-height: 400px;
        }
        .chunk-container {
          min-height: 60px;
        }
      }
      /* Focus styles for accessibility */
      .focus-visible {
        outline: 2px solid rgba(255, 255, 255, 0.5);
        outline-offset: 2px;
      }
      /* Loading animation */
      .spinner {
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        from {
          transform: rotate(0deg);
        }
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body class="min-h-screen text-white">
    <div class="container mx-auto px-4 py-6 sm:py-8 max-w-4xl">
      <!-- Header Section -->
      <header class="text-center mb-6 sm:mb-8">
        <h1 class="text-2xl sm:text-3xl font-bold mb-2">
          YouTube Transcript Extractor
        </h1>
        <p class="text-gray-400 text-sm sm:text-base">
          Extract and download transcripts from YouTube videos
        </p>
      </header>

      <!-- Input Section -->
      <section
        class="glass rounded-sm p-4 sm:p-6 mb-6"
        aria-label="Video URL Input"
      >
        <div class="flex flex-col sm:flex-row gap-3">
          <input
            type="url"
            id="urlInput"
            placeholder="Paste YouTube URL here..."
            aria-label="YouTube video URL"
            class="flex-1 px-4 py-3 bg-black/20 border border-white/20 rounded-sm text-white placeholder-gray-400 focus:outline-none focus:border-white/40 focus:ring-2 focus:ring-white/20 text-sm sm:text-base"
            autocomplete="off"
            spellcheck="false"
          />
          <button
            id="getTranscript"
            aria-label="Extract transcript"
            class="px-4 sm:px-6 py-3 bg-white text-black rounded-sm hover:bg-gray-200 transition-colors flex items-center justify-center gap-2 font-medium text-sm sm:text-base min-w-[140px] sm:min-w-[160px]"
          >
            <i class="fas fa-download" aria-hidden="true"></i>
            <span id="buttonText">Get Transcript</span>
          </button>
        </div>

        <!-- Error Display -->
        <div
          id="error"
          class="text-red-400 text-sm mt-3 hidden"
          role="alert"
          aria-live="polite"
        ></div>
      </section>

      <!-- Video Section -->
      <section
        id="videoSection"
        class="glass rounded-sm p-4 sm:p-6 mb-6 hidden"
        aria-label="Video Player"
      >
        <div
          id="videoContainer"
          class="w-full aspect-video rounded-sm overflow-hidden bg-black/20"
        ></div>
      </section>

      <!-- Transcript Section -->
      <section
        id="transcriptSection"
        class="glass rounded-sm p-4 sm:p-6 hidden"
        aria-label="Transcript Content"
      >
        <!-- Tab Navigation -->
        <nav
          class="flex gap-1 mb-4 bg-black/20 rounded-sm p-1"
          role="tablist"
          aria-label="Transcript view options"
        >
          <button
            id="timestampsTab"
            role="tab"
            aria-selected="true"
            aria-controls="timestampsContent"
            class="flex-1 py-2 px-3 sm:px-4 rounded-sm bg-white text-black font-medium text-sm sm:text-base"
          >
            <i class="fas fa-clock mr-1 sm:mr-2" aria-hidden="true"></i>
            <span class="hidden sm:inline">With </span>Timestamps
          </button>
          <button
            id="plainTab"
            role="tab"
            aria-selected="false"
            aria-controls="plainContent"
            class="flex-1 py-2 px-3 sm:px-4 rounded-sm text-gray-400 hover:text-white transition-colors text-sm sm:text-base"
          >
            <i class="fas fa-align-left mr-1 sm:mr-2" aria-hidden="true"></i>
            <span class="hidden sm:inline">Plain </span>Text
          </button>
        </nav>

        <!-- Controls -->
        <div
          class="flex flex-col sm:flex-row sm:justify-between sm:items-center gap-3 sm:gap-2 mb-4"
        >
          <div class="flex gap-2">
            <button
              id="copyBtn"
              aria-label="Copy entire transcript to clipboard"
              class="flex-1 sm:flex-none px-3 sm:px-4 py-2 bg-black/40 border border-white/20 rounded-sm hover:bg-black/60 transition-colors flex items-center justify-center gap-2 text-sm"
            >
              <i class="fas fa-copy" aria-hidden="true"></i>
              Copy All
            </button>
            <button
              id="downloadBtn"
              aria-label="Download transcript as text file"
              class="flex-1 sm:flex-none px-3 sm:px-4 py-2 bg-black/40 border border-white/20 rounded-sm hover:bg-black/60 transition-colors flex items-center justify-center gap-2 text-sm"
            >
              <i class="fas fa-download" aria-hidden="true"></i>
              Download
            </button>
          </div>
          <div
            class="flex items-center justify-end text-xs sm:text-sm text-gray-400"
          >
            <span id="transcriptStats" aria-live="polite"></span>
          </div>
        </div>

        <!-- Transcript Content -->
        <div class="glass-dark rounded-sm" role="main">
          <!-- Timestamps View -->
          <div
            id="timestampsContent"
            class="transcript-scroll p-3 sm:p-4 space-y-3 sm:space-y-4"
            role="tabpanel"
            aria-labelledby="timestampsTab"
            tabindex="0"
          ></div>

          <!-- Plain Text View -->
          <div
            id="plainContent"
            class="transcript-scroll p-3 sm:p-4 space-y-3 sm:space-y-4 hidden"
            role="tabpanel"
            aria-labelledby="plainTab"
            tabindex="0"
          ></div>
        </div>
      </section>

      <!-- Loading State -->
      <section
        id="loading"
        class="text-center py-8 hidden"
        aria-label="Loading transcript"
        aria-live="polite"
      >
        <i
          class="fas fa-spinner spinner text-xl sm:text-2xl mb-2"
          aria-hidden="true"
        ></i>
        <p class="text-gray-400 text-sm sm:text-base">Fetching transcript...</p>
      </section>
    </div>

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
